<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        body { font-family: Vazirmatn, Tahoma; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 350px; }
        h1 { color: #1976D2; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-family: Vazirmatn; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1976D2; color: white; border: none; border-radius: 8px; font-family: Vazirmatn; font-size: 16px; cursor: pointer; }
        button:hover { background: #1565C0; }
        .error { color: red; text-align: center; font-size: 14px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #1976D2; text-decoration: none; }
    </style>
</head>
<body>
    <form method="post">
        <h1>🛒 ورود</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <input type="text" name="username" placeholder="یوزرنیم" required>
        <input type="password" name="password" placeholder="پسورد" required>
        <button type="submit">ورود</button>
        <div class="link">حساب نداری؟ <a href="/register">ثبت‌نام کن</a></div>
    </form>
</body>
</html>
